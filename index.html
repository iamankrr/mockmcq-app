<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b6cf6">
<title>MCQ Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
 :root{
  --bg:#f3f5fb;--card:#fff;--text:#1f2430;--muted:#6b7280;
  --primary:#3b6cf6;--primary-soft:#eef2ff;--border:#e3e7ef;
  --ok-bg:#dcfce7;--ok-bd:#22a35a;--bad-bg:#fee2e2;--bad-bd:#e03b3b;--warn:#f59e0b;
  --shadow:0 4px 24px rgba(30,45,90,.08);
 }
 @media (prefers-color-scheme:dark){
  :root{
   --bg:#0f1218;--card:#1a1f2b;--text:#e8ebf2;--muted:#9aa3b5;
   --primary:#5b86ff;--primary-soft:#232b45;--border:#2c3447;
   --ok-bg:#12351f;--ok-bd:#2fbf6c;--bad-bg:#3b1618;--bad-bd:#ef5a5a;
   --shadow:0 4px 24px rgba(0,0,0,.35);
  }
 }
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
 html{scroll-behavior:smooth}
 body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  max-width:640px;margin:0 auto;
  padding:14px 14px calc(90px + env(safe-area-inset-bottom));
  background:
   radial-gradient(600px 300px at 90% -80px,rgba(139,92,246,.18),transparent 70%),
   radial-gradient(500px 280px at -10% -60px,rgba(59,108,246,.18),transparent 70%),
   var(--bg);
  background-attachment:fixed;
  color:var(--text);line-height:1.5;font-size:16px;
 }

 /* ---------- header ---------- */
 .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0 18px}
 .brand{display:flex;align-items:center;gap:12px;min-width:0}
 .logo{
  width:46px;height:46px;border-radius:14px;flex-shrink:0;color:#fff;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);
  display:grid;place-items:center;box-shadow:0 8px 18px rgba(59,108,246,.35);
 }
 .logo svg{width:24px;height:24px}
 h1{
  margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px;line-height:1.2;
  background:linear-gradient(90deg,var(--primary),#8b5cf6);
  -webkit-background-clip:text;background-clip:text;color:transparent;
 }
 .brand p{margin:0;font-size:12.5px;color:var(--muted)}
 .social{display:flex;gap:8px;align-items:center}
 .social a{
  color:var(--primary);display:grid;place-items:center;width:42px;height:42px;
  border-radius:13px;background:var(--card);border:1px solid var(--border);
  box-shadow:var(--shadow);transition:transform .15s,background .15s;
 }
 .social a:hover{transform:translateY(-2px);background:var(--primary-soft)}
 .social a:active{transform:scale(.93)}
 .social svg{width:22px;height:22px;display:block}

 /* ---------- cards ---------- */
 .card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:18px;margin:14px 0;box-shadow:var(--shadow);
 }
 .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
 .stat{background:var(--primary-soft);border-radius:16px;padding:14px 6px;text-align:center}
 .stat span{display:block;font-size:26px;font-weight:800;color:var(--primary);line-height:1.1}
 .stat small{font-size:11.5px;color:var(--muted);font-weight:600}
 #msg{color:var(--muted);margin:12px 0 0;font-size:14px}
 #msg:empty{display:none}

 .drop{
  margin-top:16px;border:2px dashed var(--border);border-radius:18px;
  padding:22px 14px;text-align:center;cursor:pointer;background:var(--primary-soft);
  transition:border-color .15s,transform .12s;
 }
 .drop:hover{border-color:var(--primary)}
 .drop:active{transform:scale(.985)}
 .drop svg{width:30px;height:30px;color:var(--primary);margin-bottom:4px}
 .drop b{display:block;font-size:16px}
 .drop small{color:var(--muted);font-size:13px}

 .setting{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}
 .setting b{display:block;font-size:15px}
 .setting small{color:var(--muted);font-size:12.5px}
 .stepper{display:flex;align-items:center;gap:6px}
 .stepper button{width:40px;height:40px;padding:0;margin:0;font-size:20px;border-radius:12px;line-height:1}
 .stepper input{
  width:64px;height:40px;text-align:center;font-size:16px;font-weight:700;
  border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);
  -moz-appearance:textfield;
 }
 .stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

 .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
 .actions button{
  margin:0;padding:12px 6px;display:flex;flex-direction:column;align-items:center;
  gap:4px;font-size:13px;border-radius:14px;
 }
 .actions svg{width:20px;height:20px}
 .danger{color:var(--bad-bd)!important}

 /* ---------- history ---------- */
 .h-title{font-weight:800;font-size:15px;margin-bottom:8px}
 .h-row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-top:1px solid var(--border);font-size:13.5px;color:var(--muted);
 }
 .pill{padding:4px 10px;border-radius:999px;font-size:13px;white-space:nowrap}
 .pill.g{background:var(--ok-bg);color:var(--ok-bd)}
 .pill.y{background:#fef3c7;color:#b45309}
 .pill.r{background:var(--bad-bg);color:var(--bad-bd)}
 .empty{color:var(--muted);font-size:14px;padding:6px 0}

 /* ---------- buttons ---------- */
 button{
  background:var(--primary);color:#fff;border:0;border-radius:14px;
  padding:13px 18px;font-size:16px;font-weight:600;margin:5px 6px 5px 0;
  cursor:pointer;box-shadow:0 4px 12px rgba(59,108,246,.3);
  transition:transform .12s,filter .12s;
 }
 button:active{transform:scale(.97);filter:brightness(.92)}
 button.alt{background:var(--card);color:var(--text);border:1px solid var(--border);box-shadow:none}
 button.big{
  width:100%;padding:16px;font-size:18px;display:flex;justify-content:center;
  align-items:center;gap:8px;
 }
 button.big svg{width:20px;height:20px}
 #startBtn{
  margin:0;background:linear-gradient(135deg,var(--primary),#8b5cf6);
  box-shadow:0 10px 24px rgba(91,70,246,.4);
 }
 .row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}

 /* ---------- test / review ---------- */
 .qtext{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px;font-weight:700}
 .qno{
  flex-shrink:0;min-width:30px;height:30px;padding:0 8px;border-radius:999px;
  background:var(--primary-soft);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;
 }
 label{
  display:flex;align-items:flex-start;gap:10px;
  padding:13px 14px;margin:8px 0;border:1.5px solid var(--border);
  border-radius:14px;cursor:pointer;background:var(--card);
  transition:border-color .15s,background .15s;
 }
 label input[type=radio]{
  margin-top:4px;width:18px;height:18px;flex-shrink:0;accent-color:var(--primary);
 }
 label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
 label.ok,label.ok:has(input:checked){background:var(--ok-bg);border-color:var(--ok-bd)}
 label.bad,label.bad:has(input:checked){background:var(--bad-bg);border-color:var(--bad-bd)}
 label.ok::after{content:"✔";margin-left:auto;color:var(--ok-bd);font-weight:800}
 label.bad::after{content:"✘";margin-left:auto;color:var(--bad-bd);font-weight:800}
 label:has(input:disabled){cursor:default}

 .warn{border-left:6px solid var(--warn)}
 .warn small{color:var(--warn);font-weight:600}

 #bar{
  position:sticky;top:0;z-index:10;margin:0 -14px 8px;padding:10px 14px;
  background:var(--bg);border-bottom:1px solid var(--border);
 }
 #bar .t{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
 #bar .track{height:8px;border-radius:99px;background:var(--border);overflow:hidden}
 #bar .fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#8b5cf6);transition:width .25s}

 .score{
  font-size:34px;font-weight:800;text-align:center;padding:26px 16px;
  background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;border:0;
 }
 .score small{display:block;font-size:15px;font-weight:500;opacity:.9;margin-top:4px}

 #subwrap{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));margin-top:14px}
 #sub{box-shadow:0 6px 18px rgba(59,108,246,.45);margin:0}
 .hide{display:none}
</style>
</head>
<body>

<header class="top">
 <div class="brand">
  <div class="logo">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>

 <div class="social">

   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>

   <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.1.79-.25.79-.56v-2c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.62 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>

<div id="home">
 <div class="card">
  <div class="stats">

   </button>

<script>
// worker script is already loaded via <script> tag above,
// so if the real Worker fails (mobile Safari), pdf.js falls back to the main thread
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const KEY='mcqBank',HK='mcqHist';
let bank=JSON.parse(localStorage.getItem(KEY)||'[]');
let hist=JSON.parse(localStorage.getItem(HK)||'[]');
let paper=[],pending=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const save=()=>{localStorage.setItem(KEY,JSON.stringify(bank));$('count').textContent=bank.length;$('nq').max=bank.length};

function showHist(){
 $('tests').textContent=hist.length;
 const best=hist.length?Math.max(...hist.map(h=>Math.round(h.s/h.n*100))):0;
 $('best').textContent=best+'%';
 $('hist').innerHTML='<div class="h-title">Recent scores</div>'+(hist.length
  ?hist.slice(-5).reverse().map(h=>{
    const p=Math.round(h.s/h.n*100);
    return `<div class="h-row"><span>${h.d}</span><b class="pill ${p>=70?'g':p>=40?'y':'r'}">${h.s}/${h.n} · ${p}%</b></div>`;
   }).join('')
  :'<div class="empty">No tests taken yet. Start your first one!</div>');
}
function stepNq(d){
 const el=$('nq'),max=bank.length||1000;
 el.value=Math.max(1,Math.min(max,(parseInt(el.value)||0)+d));
}
save();showHist();

// ---------- PDF reading (bold detect) ----------
async function readPdf(file){
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
 const lines=[];
 for(let p=1;p<=pdf.numPages;p++){
  const page=await pdf.getPage(p);
  await page.getOperatorList(); // loads fonts
  const tc=await page.getTextContent();
  const cache={};
  const isBold=fn=>{
   if(fn in cache)return cache[fn];
   let b=false;
   try{const f=page.commonObjs.get(fn);b=/bold|black|heavy|semibold|demi/i.test((f.name||'')+' '+(f.fallbackName||''))||!!f.bold}catch(e){}
   return cache[fn]=b;
  };
  const rows=[];
  for(const it of tc.items){
   if(it.str==='')continue;
   const y=Math.round(it.transform[5]);
   let r=rows.find(r=>Math.abs(r.y-y)<=3);
   if(!r){r={y,items:[]};rows.push(r)}
   r.items.push({x:it.transform[4],s:it.str,b:isBold(it.fontName)});
  }
  rows.sort((a,b)=>b.y-a.y);
  for(const r of rows){
   r.items.sort((a,b)=>a.x-b.x);
   let t='',f='';
   for(const i of r.items){t+=i.s;f+=(i.b?'1':'0').repeat(i.s.length)}
   const st=t.length-t.trimStart().length,t2=t.trim();
   if(t2)lines.push({t:t2,f:f.slice(st,st+t2.length)});
  }
 }
 return lines;
}

// ---------- Parsing ----------
const SKIP=/^(wildlife ecology|week\s*\d+\s*assignment)/i;
const qRe=/^(?:Q\.?\s*)?(\d{1,3})\s*([\.\)])?\s+(\S.*)$/i;
const oRe=/^(\(?([a-dA-D])[\.\)]\s*)(.*)$/;

// splits lines glued together at page breaks:
// "time(d) Energy", "comfort6. Thomas", "method1 A guild", "dynamicsWildlife Ecology"
function splitLine(l){
 const pts=new Set();let m;
 const rules=[
  [/([^\s\(])(\([a-dA-D]\)\s)/g,1],
  [/([a-z\)])(\d{1,2}[\.\)]\s+[A-Z“"])/g,1],
  [/([a-z])(\d{1,2}\s+[A-Z])/g,1],
  [/Wildlife Ecology/g,0]
 ];
 for(const [re,off] of rules){while((m=re.exec(l.t)))pts.add(m.index+off)}
 const arr=[0,...[...pts].filter(p=>p>0).sort((a,b)=>a-b),l.t.length];
 const out=[];
 for(let i=0;i<arr.length-1;i++){
  const a=arr[i],b=arr[i+1];
  const seg=l.t.slice(a,b);
  const lead=seg.length-seg.trimStart().length;
  const t=seg.trim();
  if(t)out.push({t,f:l.f.slice(a+lead,a+lead+t.length)});
 }
 return out;
}
function boldOf(t,f,from){
 let n=0,b=0;
 for(let i=from;i<t.length;i++){if(/\s/.test(t[i]))continue;n++;if(f[i]==='1')b++}
 return n>0&&b/n>0.5;
}

function parse(rawLines){
 const lines=[];
 for(const l of rawLines){
  for(const s of splitLine(l)){if(!SKIP.test(s.t))lines.push(s)}
 }
 const items=[],bad=[];
 let q=null;
 const flush=()=>{
  if(!q)return;
  if(q.o.length===4&&!q.broken){
   const marked=q.o.map((o,i)=>o.b?i:-1).filter(i=>i>=0);
   items.push({q:q.q.trim(),o:q.o.map(o=>o.t.trim()),a:marked.length===1?marked[0]:-1,n:0});
  }else bad.push((q.q||'(question text missing)').slice(0,60));
  q=null;
 };
 for(const l of lines){
  const om=oRe.exec(l.t);
  const letter=q?'abcd'[q.o.length]:null;
  if(q&&om&&q.o.length<4&&om[2].toLowerCase()===letter){
   q.o.push({t:om[3],b:boldOf(l.t,l.f,om[1].length)});q.last='o';continue;
  }
  if(q&&om&&q.o.length===4&&om[2].toLowerCase()==='a'){
   flush();q={q:'',o:[{t:om[3],b:boldOf(l.t,l.f,om[1].length)}],last:'o',broken:true};continue;
  }
  const qm=qRe.exec(l.t);
  if(qm&&(!q||q.o.length===4||qm[2])){
   flush();q={q:qm[3],o:[],last:'q'};continue;
  }
  if(q){
   if(q.last==='o'&&q.o.length){const o=q.o[q.o.length-1];o.t+=' '+l.t;o.b=o.b||boldOf(l.t,l.f,0)}
   else q.q+=' '+l.t;
  }
 }
 flush();
 return {items,bad};
}

// ---------- Upload -> Review ----------
$('pdf').onchange=async e=>{
 pending=[];let badAll=[];
 $('msg').textContent='Reading PDF...';
 try{
  for(const f of e.target.files){
   const {items,bad}=parse(await readPdf(f));
   pending.push(...items);
   badAll.push(...bad);
  }
 }catch(err){$('msg').textContent='Error: '+err.message;return}
 e.target.value='';
 $('msg').textContent='';
 renderReview(badAll);
};

function renderReview(bad){
 const flagged=pending.filter(p=>p.a<0).length;
 let h=`<div class="card"><b>${pending.length}</b> questions found.<br>
  ✅ Answer detected from bold: <b>${pending.length-flagged}</b><br>
  ⚠️ Needs manual selection: <b>${flagged}</b>`+
  (bad.length?`<br>❌ Could not parse (${bad.length}):<br><small>${bad.map(esc).join('<br>')}</small>`:'')+
  `<div class="row"><button onclick="saveReview()">💾 Save all</button><button class="alt" onclick="cancelReview()">Cancel</button></div></div>`;
 pending.forEach((p,i)=>{
  h+=`<div class="card ${p.a<0?'warn':''}"><div class="qtext"><span class="qno">${i+1}</span><span>${esc(p.q)}</span></div>`;
  p.o.forEach((o,j)=>h+=`<label class="${p.a===j?'ok':''}"><input type="radio" name="r${i}" ${p.a===j?'checked':''} onchange="pending[${i}].a=${j};setOk(${i},${j})"> <span>${'ABCD'[j]}. ${esc(o)}</span></label>`);
  if(p.a<0)h+='<small>⚠️ Bold answer not found, please select the correct option</small>';
  h+='</div>';
 });
 h+=`<button class="big" onclick="saveReview()">💾 Save all</button>`;
 $('review').innerHTML=h;
 $('home').classList.add('hide');$('review').classList.remove('hide');scrollTo(0,0);
}
function setOk(i,j){
 document.querySelectorAll(`input[name=r${i}]`).forEach((r,k)=>r.parentElement.classList.toggle('ok',k===j));
}
function saveReview(){
 const ok=pending.filter(p=>p.a>=0),skip=pending.length-ok.length;
 if(skip&&!confirm(`${skip} questions have no answer selected and will not be saved. Continue?`))return;
 ok.forEach(p=>bank.push({q:p.q,o:p.o,a:p.a,n:0}));
 save();cancelReview();
 $('msg').textContent=`✅ ${ok.length} questions saved.`;
}
function cancelReview(){
 pending=[];$('review').classList.add('hide');$('home').classList.remove('hide');
}

// ---------- Test ----------
function startTest(){
 if(!bank.length){alert('Please upload a PDF first');return}
 const N=Math.min(parseInt($('nq').value)||100,bank.length);
 // questions shown fewer times get priority, rest is random
 const pick=[...bank].sort((a,b)=>(a.n+Math.random())-(b.n+Math.random())).slice(0,N);
 pick.forEach(x=>x.n++);save();
 const p=pick.sort(()=>Math.random()-.5).map(x=>{
  const idx=[0,1,2,3].sort(()=>Math.random()-.5);
  return {q:x.q,o:idx.map(i=>x.o[i]),a:idx.indexOf(x.a),sel:-1};
 });
 renderPaper(p,true);
}
function renderPaper(p,record){
 paper=p;window.recordScore=record;
 $('home').classList.add('hide');$('test').classList.remove('hide');
 let h=`<div id="bar"><div class="t"><span id="barT">0 / ${paper.length} answered</span><span id="barP">0%</span></div><div class="track"><div class="fill" id="barF"></div></div></div>`;
 paper.forEach((x,i)=>{
  h+=`<div class="card"><div class="qtext"><span class="qno">${i+1}</span><span>${esc(x.q)}</span></div>`;
  x.o.forEach((o,j)=>h+=`<label id="l${i}_${j}"><input type="radio" name="q${i}" onchange="pick(${i},${j})"> <span>${'ABCD'[j]}. ${esc(o)}</span></label>`);
  h+='</div>';
 });
 h+='<div id="subwrap"><button id="sub" class="big" onclick="submitTest()">✅ Submit</button></div>';
 $('test').innerHTML=h;scrollTo(0,0);
}
function pick(i,j){
 paper[i].sel=j;
 const d=paper.filter(x=>x.sel>=0).length,pc=Math.round(d/paper.length*100);
 $('barT').textContent=`${d} / ${paper.length} answered`;
 $('barP').textContent=pc+'%';
 $('barF').style.width=pc+'%';
}
function submitTest(){
 const left=paper.filter(x=>x.sel<0).length;
 if(!confirm(left?`${left} questions are unanswered. Submit anyway?`:'Submit the test?'))return;
 let s=0;
 paper.forEach((p,i)=>{
  if(p.sel===p.a)s++;
  document.getElementById(`l${i}_${p.a}`).classList.add('ok');
  if(p.sel>=0&&p.sel!==p.a)document.getElementById(`l${i}_${p.sel}`).classList.add('bad');
  document.querySelectorAll(`input[name=q${i}]`).forEach(r=>r.disabled=true);
 });
 if(window.recordScore){
  hist.push({d:new Date().toLocaleString('en-IN'),s,n:paper.length});
  localStorage.setItem(HK,JSON.stringify(hist));
 }
 const wrong=paper.length-s-left,pct=Math.round(s/paper.length*100);
 $('bar').outerHTML=`<div class="card score">Score: ${s} / ${paper.length}<small>${pct}% • ✔ ${s} correct • ✘ ${wrong} wrong • ${left} skipped</small></div>`;
 const wrongList=paper.filter(p=>p.sel!==p.a);
 $('subwrap').innerHTML=
  (wrongList.length?`<button class="big" onclick="retryWrong()">🔁 Retry wrong/skipped only (${wrongList.length})</button>`:'')+
  `<button class="big alt" onclick="location.reload()">🏠 Home</button>`;
 scrollTo(0,0);
}
function retryWrong(){
 const w=paper.filter(p=>p.sel!==p.a).map(p=>{
  const idx=[0,1,2,3].sort(()=>Math.random()-.5);
  return {q:p.q,o:idx.map(i=>p.o[i]),a:idx.indexOf(p.a),sel:-1};
 });
 renderPaper(w,false);
}

// ---------- Export / Import / Clear ----------
function exportBank(){
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(bank)],{type:'application/json'}));
 a.download='mcq-bank.json';a.click();
}
$('imp').onchange=async e=>{
 const d=JSON.parse(await e.target.files[0].text());
 d.forEach(x=>bank.push(x));
 save();$('msg').textContent=`Import complete ✅ (${d.length} questions)`;e.target.value='';
};
function clearBank(){if(confirm('Delete all questions?')){bank=[];save()}}
</script>
